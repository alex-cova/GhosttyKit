name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      GHOSTTY_REF: v1.3.0
      ZIG_VERSION: 0.15.2
      # Ghostty v1.3.0 needs macOS 15+ SDK symbols (e.g. kCVPixelFormatType_30RGB_r210).
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Cache Ghostty and Zig build trees
        uses: actions/cache@v4
        with:
          path: |
            .build-ghostty
            .zig-global-cache
            Scripts/.zig-toolchain
          key: ghosttykit-build-v3-${{ env.GHOSTTY_REF }}-${{ env.ZIG_VERSION }}-${{ hashFiles('Scripts/build-ghosttykit.sh', 'Scripts/patches/**') }}
          restore-keys: |
            ghosttykit-build-v3-${{ env.GHOSTTY_REF }}-${{ env.ZIG_VERSION }}-
            ghosttykit-build-v3-

      - name: Build GhosttyKit.xcframework
        run: |
          chmod +x Scripts/build-ghosttykit.sh Scripts/shims/metallib Scripts/ci-prepare-swiftpm-checkout.sh
          ./Scripts/build-ghosttykit.sh

      - name: Build package
        run: swift build -c release

      - name: Run tests
        run: swift test

      - name: Build demo
        run: swift build -c release --product GhosttyKitDemo
